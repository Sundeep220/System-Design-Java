# --- Test profile ---
# Used by integration tests with Testcontainers PostgreSQL.
# Datasource is auto-configured by @ServiceConnection — no URL needed here.

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  sql:
    init:
      mode: always
      platform: postgres

logging:
  level:
    com.flowforge: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
