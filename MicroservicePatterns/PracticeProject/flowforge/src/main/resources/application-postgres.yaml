# --- PostgreSQL datasource (dev convenience) ---
# In production, use the 'prod' profile instead (requires env vars, no defaults).

spring:
  datasource:
    url: ${FLOWFORGE_DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${FLOWFORGE_DB_USERNAME:postgres}
    password: ${FLOWFORGE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      platform: postgres

  h2:
    console:
      enabled: false
